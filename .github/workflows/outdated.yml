name: Outdated dependencies

# Weekly report in the run summary; it never opens a PR or fails the build.
on:
    schedule:
        - cron: "0 9 * * 1"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    report:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: "24.21.0"
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Report
              run: pnpm --silent deps:outdated >> "$GITHUB_STEP_SUMMARY"
