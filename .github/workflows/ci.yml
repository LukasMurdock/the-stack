name: CI

on:
    pull_request:
    push:
        branches:
            - main
    schedule:
        - cron: "0 10 * * *"

jobs:
    fast:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: "24.21.0"
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Format check
              run: pnpm run format:check

            - name: Lint
              run: pnpm run lint

            - name: Tests
              run: pnpm test

            - name: Test type checks
              run: pnpm cf:typegen && pnpm exec astro sync && pnpm test:types

            - name: Install Chromium for tooling checks
              # pnpm shot/demo:record tooling tests drive a real browser.
              run: pnpm exec playwright install --with-deps chromium

            - name: Template tooling checks
              run: pnpm test:tooling

            - name: D1 migration parity
              run: pnpm test:migrations

    full:
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 1

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: "24.21.0"
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Proof of main's HEAD
              # Trunk audit: `pnpm ship` pushes each commit to main together
              # with its proof note, so a red step means a push bypassed it.
              # The depth-1 checkout has HEAD's commit and tree, which is all
              # `proof --check` reads besides the notes fetched here.
              # PR-based repositories (pnpm ship <pr>, Dependabot merges) land
              # commits without proofs: set the repository variable
              # STACK_PROOF_AUDIT=off to skip this audit.
              if: github.event_name == 'push' && vars.STACK_PROOF_AUDIT != 'off'
              run: |
                  if ! git fetch --no-tags origin "+refs/notes/proof:refs/notes/proof"; then
                      echo "::error::origin has no refs/notes/proof, so $GITHUB_SHA has no proof. Land commits with pnpm proof, then pnpm ship (AGENTS.md: Trunk loop and proofs)."
                      exit 1
                  fi
                  if ! pnpm proof --check HEAD; then
                      echo "::error::main's HEAD $GITHUB_SHA has no passing proof: it was pushed without pnpm ship. Prove it (pnpm proof) and push refs/notes/proof, or revert it (AGENTS.md: Trunk loop and proofs)."
                      exit 1
                  fi

            - name: Format check
              run: pnpm run format:check

            - name: Install Chromium for tooling checks
              # pnpm shot/demo:record tooling tests drive a real browser.
              run: pnpm exec playwright install --with-deps chromium

            - name: Full checks
              run: pnpm verify

            - name: Template tooling checks
              run: pnpm test:tooling
