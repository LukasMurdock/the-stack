name: CI

on:
    pull_request:
    push:
        branches:
            - main
    schedule:
        - cron: "0 10 * * *"

jobs:
    fast:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: "24.21.0"
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Format check
              run: pnpm run format:check

            - name: Lint
              run: pnpm run lint

            - name: Tests
              run: pnpm test

            - name: Test type checks
              run: pnpm cf:typegen && pnpm exec astro sync && pnpm test:types

            - name: Install Chromium for tooling checks
              # pnpm shot/demo:record tooling tests drive a real browser.
              run: pnpm exec playwright install --with-deps chromium

            - name: Template tooling checks
              run: pnpm test:tooling

            - name: D1 migration parity
              run: pnpm test:migrations

    full:
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: "24.21.0"
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Format check
              run: pnpm run format:check

            - name: Install Chromium for tooling checks
              # pnpm shot/demo:record tooling tests drive a real browser.
              run: pnpm exec playwright install --with-deps chromium

            - name: Full checks
              run: pnpm verify

            - name: Template tooling checks
              run: pnpm test:tooling
