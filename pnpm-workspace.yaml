minimumReleaseAge: 1440
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
strictDepBuilds: true
packageManagerStrictVersion: true
verifyDepsBeforeRun: error

allowBuilds:
    better-sqlite3: true
    esbuild: true
    sharp: true
    workerd: true

# Void 1.1.11's cron wrapper copies only __void_handlers.js and drops the chunks
# its bundle splits out, so `void deploy` cannot prepare the Worker. Remove the
# patch when Void ships the fix (`pnpm check:deploy` fails without it).
patchedDependencies:
    void@1.1.11: patches/void@1.1.11.patch
